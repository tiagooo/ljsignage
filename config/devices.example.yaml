# Fonte única dos dispositivos. Copiar para config/devices.yaml.
# 12 Raspberry Pi (a loja 01 / sede não tem).
# video_path: null -> descoberta automática, com confirmação no painel.

defaults:
  domain: lugardajoia.internal   # FQDN = <hostname>.<domain>
  ftp_port: 21
  ftp_passive: true
  login_home: /home/tmagalhaes
  enabled: false                 # só ativar no Pi piloto (Fase 3)
  max_bytes: null                # capacidade útil para vídeos, se conhecida

# Grupos de EXEMPLO - a definir pela equipa. "todas" é implícito.
groups:
  norte: ["04", "05", "06", "09", "10", "11"]
  centro: ["08", "13"]
  sul: ["02", "03", "07", "12"]
  galeria-da-joia: ["03", "04"]

